version: 2
updates:
  - package-ecosystem: cargo
    directory: /diri
    schedule:
      interval: weekly
      day: monday
    groups:
      rust-dependencies:
        patterns: ["*"]
    ignore:
      # gpui's `bench` macro expands against gpui's own criterion (0.5);
      # diri-term must use that same version or its benches stop compiling.
      - dependency-name: criterion
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /sidecar
    schedule:
      interval: weekly
      day: monday
    groups:
      sidecar-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: rust-toolchain
    directory: /diri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
