name: Telemetry

# The ingest Worker, the diri-debug CLI and the update mirror Worker are
# TypeScript and JavaScript beside the Rust workspace. Like the website they get their own
# path-filtered workflow, so the Rust gate in ci.yml stays untouched.

on:
  push:
    branches: [main]
    paths:
      - 'telemetry/**'
      - 'updates-mirror/**'
      - '.github/workflows/telemetry.yml'
  pull_request:
    paths:
      - 'telemetry/**'
      - 'updates-mirror/**'
      - '.github/workflows/telemetry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telemetry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Telemetry Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: telemetry/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # package.json pins the pnpm version through packageManager.
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Bundle (dry run, no Cloudflare account)
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run

  cli:
    name: diri-debug CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: telemetry/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # No install step: the CLI has no dependencies.
      - name: Test
        run: node --test "test/*.test.mjs"

  updates-mirror:
    name: Update mirror Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: updates-mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # No install step: the Worker has no dependencies.
      - name: Test
        run: node --test "test/*.test.ts"
      - name: Bundle (dry run, no Cloudflare account)
        run: npx --yes wrangler@4.124.0 deploy --dry-run --outdir .wrangler/dry-run
