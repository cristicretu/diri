name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual only: the hang-repro job below runs the two tests that are skipped
  # on runners, so it must never fire on a push or a pull request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Swift engine (daemon + CLI)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Validate shell scripts
        run: bash -n scripts/*.sh diri/scripts/*.sh
      - name: Test release publishing guards
        run: |
          bash diri/scripts/test-publish-github-release.sh
          bash diri/scripts/test-publish-homebrew-cask.sh
      - name: Install and audit browser sidecar
        working-directory: sidecar
        run: |
          npm ci
          npm audit --omit=dev
      # --no-parallel is load-bearing on CI. Run in parallel, every test starts
      # at once, and the suite then stalls indefinitely on a 3-core runner: the
      # PTY and holder tests block inside async contexts, and with that few
      # cores the cooperative pool has no thread left to make progress on.
      # A developer Mac has enough cores to hide it. Serial costs ~30s.
      #
      # SwiftPM also block-buffers when stdout is a pipe, so a test process that
      # dies takes most of its console output with it — hence the xunit file.
      # `script` gives the run a pty, which makes SwiftPM line-buffer. Piped, it
      # block-buffers, and a test process that dies takes the tail of its output
      # with it — so the log's last line is wherever the buffer happened to
      # flush, not where the run actually stopped. That cost real debugging
      # time. The xunit file is no help either: it is only written at the end.
      - name: Test
        env:
          # Runner spawns and socket binds are far slower than on a dev Mac; the
          # 5s liveness waits time out there. See waitUntil in the test helpers.
          DIRIJOR_TEST_TIMEOUT_SCALE: "6"
        run: |
          set -o pipefail
          script -q /dev/null swift test --no-parallel | tee "${RUNNER_TEMP}/test.log"
          grep -q "Test run with .* passed" "${RUNNER_TEMP}/test.log"
      - name: Where it stopped
        if: failure()
        run: tail -40 "${RUNNER_TEMP}/test.log" || true
      - name: Release build
        run: swift build -c release

  app:
    name: Rust app (diri)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: diri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      # rust-toolchain.toml pins 1.95.0 with clippy + rustfmt.
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            diri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('diri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check dependency license policy
        run: python3 ../scripts/check-licenses.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release

  bundle:
    name: Package diri.app (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            diri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('diri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # package.sh lipos two slices into a universal binary, so both targets
      # have to be installed — and installed for the toolchain diri/ pins in
      # rust-toolchain.toml, not the runner default. Adding them from the repo
      # root silently equips the wrong toolchain and the x86_64 pass then fails
      # with "can't find crate for std".
      - name: Install universal targets
        working-directory: diri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Package
        env:
          DIRI_DIST_DIR: ${{ runner.temp }}/diri-dist
        run: diri/scripts/package.sh
      - name: Verify bundle structure and signature
        run: |
          app="${RUNNER_TEMP}/diri-dist/diri.app"
          plutil -lint "${app}/Contents/Info.plist"
          test -x "${app}/Contents/Resources/bin/dirijord"
          test -x "${app}/Contents/Resources/bin/dirijord-holder"
          test -x "${app}/Contents/Resources/bin/dirijor"
          codesign --verify --deep --strict "${app}"

  # Issue #1: `isLinkedWorktreeDistinguishesMainFromLinked` hangs on a runner
  # and nobody knows where. It passes on every dev Mac, so the stack has to be
  # taken on the runner itself — and the runner is exactly where the evidence
  # goes missing, because SwiftPM block-buffers into a pipe and the job is then
  # killed on its timeout with the tail of the log still in that buffer.
  #
  # So this job does not read the log at all. It runs the skipped tests with
  # `DIRIJOR_RUN_HANGING_TESTS=1` and, from a second process that the hang
  # cannot reach, samples the test binary and every process it spawned. A
  # blocked call arrives by name.
  #
  # Manual, never on a pull request: the whole point is that it may hang.
  hang-repro:
    name: Sample the tests that hang on CI (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    # Longer than the watchdog's last pass (5min + 2 x 2min, plus sampling) so
    # the stacks are printed before the job is cut off, and long enough for the
    # ~13-minute stall that has been seen to play out.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Build tests
        run: swift build --build-tests
      - name: Run the skipped tests under the stack watchdog
        env:
          DIRIJOR_RUN_HANGING_TESTS: "1"
          DIRIJOR_TEST_TIMEOUT_SCALE: "6"
        run: |
          ./scripts/sample-hung-tests.sh 300 3 120 &
          watchdog=$!
          # No pipe and no `tee`: this job wants the run's own stdout on the
          # runner's terminal, and a failing test here is a result, not a
          # broken job.
          # One regex, not two --filter flags: --filter takes a pattern, and
          # an alternation is unambiguous about being a union. Drop the filter
          # entirely if the two alone turn out not to reproduce it — the hang
          # has only ever been seen with the rest of the suite behind it.
          script -q /dev/null swift test --no-parallel \
            --filter 'isLinkedWorktreeDistinguishesMainFromLinked|codexWrapperReentersShellAndResolvesFreshInteractivePath' \
            || true
          kill "${watchdog}" 2>/dev/null || true
          wait "${watchdog}" 2>/dev/null || true

  browser-sidecar:
    name: Browser sidecar integration
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Install sidecar and browser engines
        working-directory: sidecar
        run: |
          npm ci
          npx playwright install chromium webkit firefox
      - name: Run browser integration tests
        env:
          DIRIJOR_RUN_BROWSER_TESTS: "1"
        run: swift test --filter BrowserPoolTests
