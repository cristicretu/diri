name: DiriPhone
options:
  bundleIdPrefix: com.cristicretu.diri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # The simulator is the only target this repository can verify on its own;
    # a device build needs a signing identity the CI machine does not have.
    CODE_SIGNING_ALLOWED: NO

targets:
  DiriPhone:
    type: application
    platform: iOS
    sources:
      - path: DiriPhone
    info:
      path: DiriPhone/Info.plist
      properties:
        CFBundleDisplayName: diri
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Scan the private pairing code shown in Diri on your Mac.
        NSLocalNetworkUsageDescription: Connect to Diri on your Mac to control your coding sessions.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # diri-web speaks plain HTTP over a WireGuard tunnel. The transport is
        # already encrypted and authenticated by Tailscale; TLS on top would
        # need a certificate authority for names that only exist on the tailnet.
        # ATS exceptions are matched by domain, and a tailnet endpoint is
        # usually reached by IP literal (100.64.0.0/10), which no domain
        # exception can cover. The app only ever talks to the one host the user
        # enrolled, over a tunnel that already authenticates and encrypts it,
        # so arbitrary loads is the accurate description of the trust model
        # rather than a shortcut around one.
        # Exactly one key, deliberately: iOS 10 and later IGNORE
        # `NSAllowsArbitraryLoads` whenever a companion key such as
        # `NSAllowsLocalNetworking` is also present, so adding the "safer
        # looking" one silently re-enables ATS and every request fails.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cristicretu.diri.phone
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  DiriPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DiriPhoneTests
    dependencies:
      - target: DiriPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cristicretu.diri.phone.tests

schemes:
  DiriPhone:
    build:
      targets:
        DiriPhone: all
        DiriPhoneTests: [test]
    test:
      targets:
        - DiriPhoneTests
