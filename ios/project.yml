name: DiriPhone
options:
  bundleIdPrefix: com.cristicretu.diri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DiriPhone:
    type: application
    platform: iOS
    sources:
      - path: DiriPhone
      - path: Shared
    dependencies:
      - target: DiriNotificationService
        embed: true
    info:
      path: DiriPhone/Info.plist
      properties:
        CFBundleDisplayName: diri
        # Exempt: only Apple's URLSession/Keychain, no bundled cryptography
        # (the tunnel is the separately installed Tailscale app).
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: Scan the private pairing code shown in Diri on your Mac.
        NSLocalNetworkUsageDescription: Connect to Diri on your Mac to control your coding sessions.
        NSMicrophoneUsageDescription: Voice mode listens for your reply to an agent and transcribes it on this iPhone.
        NSSpeechRecognitionUsageDescription: Voice mode turns what you say into a message for your agent. Recognition runs on this iPhone.
        # Voice mode keeps reading turns aloud and listening with the screen
        # locked; the microphone engine is what keeps the app alive meanwhile.
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        # diri-web speaks plain HTTP over a WireGuard tunnel. The transport is
        # already encrypted and authenticated by Tailscale; TLS on top would
        # need a certificate authority for names that only exist on the tailnet.
        # ATS exceptions are matched by domain, and a tailnet endpoint is
        # usually reached by IP literal (100.64.0.0/10), which no domain
        # exception can cover. The app only ever talks to the one host the user
        # enrolled, over a tunnel that already authenticates and encrypts it,
        # so arbitrary loads is the accurate description of the trust model
        # rather than a shortcut around one.
        # Exactly one key, deliberately: iOS 10 and later IGNORE
        # `NSAllowsArbitraryLoads` whenever a companion key such as
        # `NSAllowsLocalNetworking` is also present, so adding the "safer
        # looking" one silently re-enables ATS and every request fails.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        # The App Store Connect record ("Dirijor", team A56RVNJ69X) owns this ID.
        PRODUCT_BUNDLE_IDENTIFIER: dev.dirijor.ios
        DEVELOPMENT_TEAM: A56RVNJ69X
        # Push: the development APNs environment; App Store export switches it.
        CODE_SIGN_ENTITLEMENTS: DiriPhone/DiriPhone.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Writes notifications from the gateway's words; the push carries none.
  DiriNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: DiriNotificationService
      - path: Shared
    info:
      path: DiriNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Diri notifications
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Fetches from the gateway over the tailnet: plain HTTP inside
        # WireGuard, as the app (see its NSAppTransportSecurity note).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotificationService"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dirijor.ios.notifications
        DEVELOPMENT_TEAM: A56RVNJ69X
        GENERATE_INFOPLIST_FILE: NO

  DiriPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DiriPhoneTests
    dependencies:
      - target: DiriPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cristicretu.diri.phone.tests

  # Opt-in end-to-end test against a real gateway. Skips unless DIRI_E2E_URL
  # is set; see DiriPhoneUITests/EndToEndTests.swift.
  DiriPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DiriPhoneUITests
    dependencies:
      - target: DiriPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cristicretu.diri.phone.uitests
        TEST_TARGET_NAME: DiriPhone

schemes:
  DiriPhone:
    build:
      targets:
        DiriPhone: all
        DiriPhoneTests: [test]
        DiriPhoneUITests: [test]
    test:
      targets:
        - DiriPhoneTests
        - DiriPhoneUITests
    archive:
      config: Release
