[package]
name = "diri-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Hop timestamps for the keystroke-latency harness (tests/keystroke_latency.rs).
latency-trace = []

[dependencies]
alacritty_terminal.workspace = true
base64.workspace = true
diri-proto.workspace = true
diri-notes.workspace = true
diri-pty.workspace = true
diri-telemetry.workspace = true
diri-terminal-state.workspace = true
# The Engine serves the `dirijor` MCP tools over loopback HTTP with the same
# message handling as the stdio frontend (see src/mcp_http.rs).
dirijor-mcp = { path = "../dirijor-mcp" }
getrandom.workspace = true
plist.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
toml_edit = { version = "0.25.13", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSResponder",
    "NSRunningApplication",
    "NSSecureTextField",
    "NSTextField",
    "NSView",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSGeometry",
    "NSObject",
    "NSString",
] }

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[test]]
name = "keystroke_latency"
required-features = ["latency-trace"]
