[package]
name = "diri-portable"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Portable Diri profile sync and Mac-to-Mac migration bundles. No credentials, sockets or Holder state ever enter either."

[dependencies]
# AES-256-GCM is already in the graph for the Engine's terminal swap file
# (same version, same features); bundles reuse it rather than adding an AEAD.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
# Passphrase -> key. Argon2id is the memory-hard KDF RFC 9106 recommends; the
# workspace has no password KDF, and a hand-rolled iteration of SHA-256 would
# be far cheaper to brute-force. RustCrypto, pure Rust, no C.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
diri-platform.workspace = true
diri-proto.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
