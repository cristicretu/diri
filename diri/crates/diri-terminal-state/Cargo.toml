[package]
name = "diri-terminal-state"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Local storage prototype; not enabled by the Engine or Remote Helper.
compact-history = ["alacritty_terminal/compact-history"]

[dependencies]
alacritty_terminal.workspace = true
diri-proto.workspace = true

[[bench]]
name = "terminal_throughput"
harness = false

[[bench]]
name = "terminal_fleet"
harness = false

[[bench]]
name = "terminal_parity"
harness = false
