[package]
name = "diri-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
async = ["dep:tokio"]

[dependencies]
sha2.workspace = true
tokio = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Already in the lockfile; strips `\\?\` only when the plain form is exact.
dunce = "1.0.5"
uds_windows = "1.2.1"
socket2 = "0.6.5"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials",
    "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_System_IO",
    "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_LibraryLoader",
    "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_SystemServices",
] }
