[package]
name = "diri-script"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
diri-platform.workspace = true
# `schema` gives the Engine method catalog (`api::methods`) that the Lua API
# is generated from, so the two cannot drift.
diri-proto = { workspace = true, features = ["schema"] }
mlua.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
