[package]
name = "diri-term"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
diri-proto.workspace = true
diri-telemetry.workspace = true
gpui.workspace = true
# Both already built for GPUI's own image loading; used to decode inline
# terminal images (PNG/JPEG/GIF and Kitty's zlib-compressed raw pixels).
image = { workspace = true, features = ["gif", "jpeg", "png"] }
miniz_oxide = "0.9"
# Theme import/export: `.itermcolors` property lists and diri's JSON theme
# file. All three are already built for diri-engine and diri-app.
plist.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width = "0.2.2"

[dev-dependencies]
diri-terminal-state.workspace = true
# The output-to-photon probe (examples/output_photon_probe.rs) runs a private
# in-process Engine with a real Holder behind the real renderer.
diri-engine.workspace = true
tokio.workspace = true
criterion = "0.8.2"
gpui = { workspace = true, features = ["bench"] }
gpui_platform = { workspace = true, features = ["test-support"] }

[[bench]]
name = "terminal_renderer"
harness = false

[[bench]]
name = "reading_view"
harness = false

[[bench]]
name = "find_retained"
harness = false

[[bench]]
name = "terminal_interactions"
harness = false

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The probe keeps its panel out of the Dock and the app switcher.
objc = "0.2"
