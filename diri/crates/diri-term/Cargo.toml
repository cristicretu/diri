[package]
name = "diri-term"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
diri-proto.workspace = true
gpui.workspace = true
unicode-width = "0.2.2"

[dev-dependencies]
diri-terminal-state.workspace = true
criterion = "0.8.2"
gpui = { workspace = true, features = ["bench"] }
gpui_platform = { workspace = true, features = ["test-support"] }

[[bench]]
name = "terminal_renderer"
harness = false

[[bench]]
name = "reading_view"
harness = false

[[bench]]
name = "find_retained"
harness = false
