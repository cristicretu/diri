# Dev-only tooling: workerd and esbuild ship native binaries through their
# install scripts, which wrangler and the test pool need.
allowBuilds:
  esbuild: true
  workerd: true

# miniflare pins sharp 0.35.2 (libheif advisories GHSA-g89c-p67h-r497,
# GHSA-2jg2-4ch7-h545); the patch release is API-compatible. Drop this once
# wrangler/miniflare ship >= 0.35.4.
overrides:
  sharp: ^0.35.4
  # The same miniflare (pinned exactly by @cloudflare/vitest-pool-workers
  # 0.22.0 and 0.23.0) pins undici 7.29.0, which has open advisories fixed in
  # 7.30.1. Drop this once the pool's miniflare ships undici >= 7.30.1.
  undici: ^7.30.1
